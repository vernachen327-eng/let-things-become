        <h1 class="article-title">色彩油鉛練習：畫成長中的力量</h1>
    </header>
    <article class="article-body">
        <p>只要一提到植物，你就會有一個植物的想像跳出來。你可以畫得很漂亮，但「漂亮」不是重點。要練習去經驗那股看不見、卻充滿生機的生命力。</p>
        <p>靜靜感受黃色作為光與安在的藍相遇，尋找生長的綠色意願。</p>
        <p>白色是靈性存在，peach blooms 淡粉肌色是智慧的意涵，非常需要自己花時間去感知、覺受的。它代表著良善的力量，但需要很細緻的出現，否則如同太多的良善，其實也是失去自由。</p>
    </article>
